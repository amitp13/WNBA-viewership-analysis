version: 2

models:
  - name: fct_telecasts
    description: "One row per national TV broadcast, 2024 and 2025. Viewers plus everything that might explain them: stars, Elo, network, time slot, NFL overlap. The table the regression uses."
    columns:
      - name: game_id
        description: "ESPN game ID. One row per broadcast."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game')
                field: game_id
      - name: home_team
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: away_team
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: network
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_network')
                field: network
      - name: game_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: game_date
      - name: season
        description: "Filled only if the broadcast found its game in the schedule."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2024, 2025]
      - name: home_elo_pre
        data_tests:
          - not_null
      - name: away_elo_pre
        data_tests:
          - not_null
      - name: nfl_games_overlapping
        data_tests:
          - not_null
      - name: superstars_available
        data_tests:
          - not_null
      - name: viewers
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

  - name: dim_game
    description: "One row per 2024-2025 WNBA game."
    columns:
      - name: game_id
        data_tests:
          - unique
          - not_null

  - name: dim_team
    description: "One row per WNBA franchise."
    columns:
      - name: team_key
        data_tests:
          - unique
          - not_null

  - name: dim_network
    description: "One row per TV network. is_broadcast = free over-the-air (ABC, CBS, ION)."
    columns:
      - name: network
        data_tests:
          - unique
          - not_null

  - name: dim_date
    description: "One row per date with at least one national broadcast."
    columns:
      - name: game_date
        data_tests:
          - unique
          - not_null