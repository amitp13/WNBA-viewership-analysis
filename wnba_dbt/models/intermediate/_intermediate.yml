version: 2

models:
  - name: int_elo_by_game
    description: "Pregame and postgame Elo for both teams in every game, 2022-2025, using FiveThirtyEight's method. 2022 is checked against FiveThirtyEight by tests/assert_elo_matches_fivethirtyeight_2022.sql. See docs/decisions.md, 'Elo method' and 'Elo backtest'."
    columns:
      - name: game_id
        description: "ESPN game ID. Blank for 2022 (FiveThirtyEight's file has no ESPN IDs)."
        data_tests:
          - unique
          - not_null:
              config:
                where: "season >= 2023"

      - name: home_team
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('team_map')
                field: team_key

      - name: away_team
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('team_map')
                field: team_key

      - name: home_elo_pre
        data_tests:
          - not_null
      - name: away_elo_pre
        data_tests:
          - not_null
      - name: home_win_prob
        data_tests:
          - not_null

  - name: int_star_availability
    description: "One row per star per game her team played, 2024-2025. Unavailable = no box score row or DID_NOT_PLAY. See docs/decisions.md, 'Star rule'."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - athlete_id
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_wehoop__schedule')
                field: game_id
      - name: tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['superstar', 'star']
      - name: is_available
        data_tests:
          - not_null