version: 2

models:
  - name: metricflow_time_spine
    description: "One row per day, 2024 and 2025. Calendar table MetricFlow uses to group metrics by time."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests:
          - unique
          - not_null