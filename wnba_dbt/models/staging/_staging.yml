version: 2

models:
  - name: stg_wehoop__schedule
    description: "One row per WNBA game, 2023-2025, from wehoop/ESPN. All-Star games removed. See docs/decisions.md."
    columns:
      - name: game_id
        description: "ESPN game ID. Primary key."
        data_tests:
          - unique
          - not_null

      - name: game_type
        description: "Our label for ESPN's type_id. Null means an unknown new type appeared."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['regular_season', 'commissioners_cup_final', 'first_round', 'semifinals', 'finals']

      - name: is_playoff
        description: "True for first round, semifinals and finals."
        data_tests:
          - not_null

      - name: is_commissioners_cup
        description: "True for Cup group-stage games and the Cup final."
        data_tests:
          - not_null

      - name: start_time_et
        description: "Tip-off in US Eastern time, no time zone attached."
        data_tests:
          - not_null

      - name: home_team_id
        description: "ESPN team ID of the home team. Maps to team_map.espn_team_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('team_map')
                field: espn_team_id

      - name: away_team_id
        description: "ESPN team ID of the away team. Maps to team_map.espn_team_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('team_map')
                field: espn_team_id

      - name: notes_headline
        description: "ESPN's free-text note, e.g. 'WNBA Semifinals - Game 5'. Kept for tracing."


  - name: stg_wehoop__player_box
    description: "One row per player per game, 2024-2025, from wehoop/ESPN. Includes All-Star game rows (teams like TEAM CLARK); they drop out when joined to stg_wehoop__schedule, which has no All-Star games."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - athlete_id
    columns:
      - name: game_id
        description: "ESPN game ID. Matches stg_wehoop__schedule.game_id."
        data_tests:
          - not_null

      - name: athlete_id
        description: "ESPN player ID (Caitlin Clark = 4433403)."
        data_tests:
          - not_null

      - name: team_id
        description: "ESPN team ID of the player's team in this game."
        data_tests:
          - not_null

      - name: did_not_play
        description: "True if the player was listed but did not play. A player who sat out may also have no row at all."
        data_tests:
          - not_null

      - name: dnp_reason
        description: "Why the player did not play. Null for players who played."

      - name: is_home
        description: "True if the player's team was the home team."
        data_tests:
          - not_null