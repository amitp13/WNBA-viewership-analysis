version: 2

models:
  - name: stg_wehoop__schedule
    description: "One row per WNBA game, 2023-2025, from wehoop/ESPN. All-Star games removed. See docs/decisions.md."
    columns:
      - name: game_id
        description: "ESPN game ID. Primary key."
        data_tests:
          - unique
          - not_null

      - name: game_type
        description: "Our label for ESPN's type_id. Null means an unknown new type appeared."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['regular_season', 'commissioners_cup_final', 'first_round', 'semifinals', 'finals']

      - name: is_playoff
        description: "True for first round, semifinals and finals."
        data_tests:
          - not_null

      - name: is_commissioners_cup
        description: "True for Cup group-stage games and the Cup final."
        data_tests:
          - not_null

      - name: start_time_et
        description: "Tip-off in US Eastern time, no time zone attached."
        data_tests:
          - not_null

      - name: home_team_id
        description: "ESPN team ID of the home team. Maps to team_map.espn_team_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('team_map')
                field: espn_team_id

      - name: away_team_id
        description: "ESPN team ID of the away team. Maps to team_map.espn_team_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('team_map')
                field: espn_team_id

      - name: notes_headline
        description: "ESPN's free-text note, e.g. 'WNBA Semifinals - Game 5'. Kept for tracing."

  - name: stg_wehoop__player_box
    description: "One row per player per game, 2024-2025, from wehoop/ESPN. Includes All-Star game rows (teams like TEAM CLARK); they drop out when joined to stg_wehoop__schedule, which has no All-Star games."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - athlete_id
    columns:
      - name: game_id
        description: "ESPN game ID. Matches stg_wehoop__schedule.game_id."
        data_tests:
          - not_null

      - name: athlete_id
        description: "ESPN player ID (Caitlin Clark = 4433403)."
        data_tests:
          - not_null

      - name: team_id
        description: "ESPN team ID of the player's team in this game."
        data_tests:
          - not_null

      - name: did_not_play
        description: "True if the player was listed but did not play. A player who sat out may also have no row at all."
        data_tests:
          - not_null

      - name: dnp_reason
        description: "Why the player did not play. Null for players who played."

      - name: is_home
        description: "True if the player's team was the home team."
        data_tests:
          - not_null

  - name: stg_fivethirtyeight__elo
    description: "FiveThirtyEight WNBA Elo, 2021-2022 only. One row per game. 2021 seeds the 2022 backtest; end-of-2022 ratings seed the 2023-2025 extension. See docs/decisions.md."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_date, home_team_abbr, away_team_abbr]
    columns:
      - name: game_date
        description: "Game date, converted from text."
        data_tests:
          - not_null
      - name: is_playoff
        description: "True for playoff games."
        data_tests:
          - not_null
      - name: is_commissioners_cup_final
        description: "True for the Commissioner's Cup Championship, one per season."
        data_tests:
          - not_null
      - name: home_team_abbr
        description: "FiveThirtyEight code for the home team. Maps to team_map.fivethirtyeight_abbr."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('team_map')
                field: fivethirtyeight_abbr
      - name: away_team_abbr
        description: "FiveThirtyEight code for the away team. Maps to team_map.fivethirtyeight_abbr."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('team_map')
                field: fivethirtyeight_abbr
      - name: home_elo_pre
        description: "Home team's Elo going into the game."
        data_tests:
          - not_null
      - name: away_elo_pre
        description: "Away team's Elo going into the game."
        data_tests:
          - not_null

  - name: stg_nfl__games
    description: "NFL games played in calendar years 2024 and 2025, from nflverse. One row per game. Used only to check whether an NFL game overlapped a WNBA telecast. Kickoff times are Eastern. See docs/decisions.md."
    columns:
      - name: game_id
        description: "nflverse game ID. Primary key."
        data_tests:
          - unique
          - not_null
      - name: game_type
        description: "REG = regular season; WC, DIV, CON, SB = playoff rounds. The file has no preseason."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REG', 'WC', 'DIV', 'CON', 'SB']
      - name: game_date
        description: "Game date, converted from text."
        data_tests:
          - not_null
      - name: kickoff_et
        description: "Kickoff in US Eastern time, built from gameday plus gametime."
        data_tests:
          - not_null
  
  - name: stg_telecasts
    description: "One row per national TV broadcast (2024 and 2025), matched to its game. Built from the telecasts seed. See docs/decisions.md, rules 1 to 10."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "viewers is not null or notes = 'not published'"
    columns:
      - name: game_id
        description: "ESPN game ID from stg_wehoop__schedule. Empty would mean the broadcast matched no game."
        data_tests:
          - not_null
          - unique
      - name: network
        data_tests:
          - accepted_values:
              arguments:
                values: ['ABC', 'CBS', 'CBSSN', 'ESPN', 'ESPN2', 'ION', 'NBA TV']
      - name: viewers
        description: "Average viewers, whole number. Empty when no number was published."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: measurement
        data_tests:
          - accepted_values:
              arguments:
                values: ['panel', 'big_data_panel']
          - not_null:
              config:
                where: "viewers is not null"
      - name: source_url
        data_tests:
          - not_null:
              config:
                where: "viewers is not null"